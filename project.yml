name: Oralis
options:
  bundleIdPrefix: com.oralis
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

configFiles:
  Release: Secrets.xcconfig
  Debug: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: NW57L28677
    ENABLE_HARDENED_RUNTIME: YES
    INFOPLIST_FILE: Sources/Aria/Resources/Info.plist

targets:
  Oralis:
    type: application
    platform: macOS
    sources:
      - Sources/Aria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oralis.app
        PRODUCT_NAME: Oralis
        MARKETING_VERSION: "4.0"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Aria/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Aria/Resources/Oralis.entitlements
        MICROSOFT_OAUTH_CLIENT_ID: ""
        ELEVENLABS_PROXY_URL: ""
        ORALIS_PROXY_URL: ""
    entitlements:
      path: Sources/Aria/Resources/Oralis.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.addressbook: true
    scheme:
      testTargets:
        - OralisTests

  OralisTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AriaTests
    dependencies:
      - target: Oralis
