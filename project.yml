name: Aria
options:
  bundleIdPrefix: com.aria
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    INFOPLIST_FILE: Sources/Aria/Resources/Info.plist

targets:
  Aria:
    type: application
    platform: macOS
    sources:
      - Sources/Aria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aria.app
        PRODUCT_NAME: Aria
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Aria/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Aria/Resources/Aria.entitlements
    entitlements:
      path: Sources/Aria/Resources/Aria.entitlements
    scheme:
      testTargets:
        - AriaTests

  AriaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AriaTests
    dependencies:
      - target: Aria
