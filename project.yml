name: Oralis
options:
  bundleIdPrefix: com.oralis
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    INFOPLIST_FILE: Sources/Aria/Resources/Info.plist

targets:
  Oralis:
    type: application
    platform: macOS
    sources:
      - Sources/Aria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oralis.app
        PRODUCT_NAME: Oralis
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Aria/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Aria/Resources/Oralis.entitlements
    entitlements:
      path: Sources/Aria/Resources/Oralis.entitlements
    scheme:
      testTargets:
        - OralisTests

  OralisTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AriaTests
    dependencies:
      - target: Oralis
